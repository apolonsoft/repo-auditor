[project]
name = "repo-auditor"
version = "0.1.0"
description = "Security scanner to audit repositories for malware, hijacked registries, dangerous hooks, and vulnerable packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
repo-auditor = "repo_auditor.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
